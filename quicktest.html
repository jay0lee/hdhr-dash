<!DOCTYPE html>
<html><head><title>TESTING</title></head>
<body>
<canvas id="pc" width="1920" height="1080" style="display:none"></canvas>
<script src="atsc-demuxer.js?v=2.0.93"></script>
<script src="player-renderer.js?v=2.0.93"></script>
<script>
window.T = { segs: [], err: null, rendered: 0, dropped: 0, fps: 0, done: false, ch: '', queue: 0 };
var HDHR = '10.1.0.4';

function testChannel(ch, durSec) {
  return new Promise(function(resolve) {
    window.T = { segs: [], err: null, rendered: 0, dropped: 0, fps: 0, done: false, ch: ch, queue: 0 };
    var r, ap, sy;
    try {
      var c = document.getElementById('pc');
      try { r = new WebGLVideoRenderer(c); } catch(e) {
        r = { renderFrame: function(){}, clear: function(){} };
      }
      ap = new WebAudioPlayer({ sampleRate: 48000 });
      sy = new AVSynchronizer(r, ap);
    } catch(e) { window.T.err = e.message; resolve(); return; }

    var w = new Worker('atsc-worker.js?v=2.0.93');
    var aborted = false;
    w.onmessage = function(e) {
      var m = e.data; if (!m) return;
      if (m.type === 'READY') { try{ap.resume();}catch(x){} sy.start(); }
      else if (m.type === 'VIDEO_BATCH') {
        if (m.yuvData && m.frames) {
          for (var i = 0; i < m.frames.length; i++) {
            var f = m.frames[i];
            sy.queueVideoFrame({
              pts: f.pts, width: m.width, height: m.height, isInterlaced: m.isInterlaced,
              y: new Uint8Array(m.yuvData, f.offset, m.yPlaneSize),
              u: new Uint8Array(m.yuvData, f.offset + m.yPlaneSize, m.uvPlaneSize),
              v: new Uint8Array(m.yuvData, f.offset + m.yPlaneSize + m.uvPlaneSize, m.uvPlaneSize)
            });
          }
        }
      } else if (m.type === 'AUDIO_BATCH') {
        if (m.left && m.right) {
          var l = new Float32Array(m.left), ri = new Float32Array(m.right);
          var pts = m.pts, sr = m.sampleRate || 48000;
          for (var s = 0; s < m.totalSamples; s += 9600) {
            var len = Math.min(9600, m.totalSamples - s);
            ap.queueAudio(l.subarray(s,s+len), ri.subarray(s,s+len), pts, sr);
            pts += len / sr;
          }
        }
      } else if (m.type === 'WORKER_LOG') {
        window.T.segs.push(m.text);
      } else if (m.type === 'ERROR') {
        window.T.err = m.message;
      }
    };
    w.postMessage({ type: 'INIT' });

    var ctrl = new AbortController();
    fetch('http://' + HDHR + ':5004/auto/v' + ch, {signal: ctrl.signal}).then(function(res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var rd = res.body.getReader();
      function pump() {
        rd.read().then(function(r) {
          if (r.done || aborted) return;
          if (r.value && r.value.byteLength > 0) {
            var b = r.value.byteOffset===0 && r.value.byteLength===r.value.buffer.byteLength
              ? r.value.buffer : r.value.buffer.slice(r.value.byteOffset, r.value.byteOffset+r.value.byteLength);
            w.postMessage({type:'CHUNK',chunk:b},[b]);
          }
          pump();
        }).catch(function(){});
      }
      pump();
    }).catch(function(e) { if (!aborted) window.T.err = e.message; });

    setTimeout(function() {
      aborted = true;
      ctrl.abort();
      w.postMessage({type:'FLUSH'});
      setTimeout(function() {
        window.T.rendered = sy.renderedFrames;
        window.T.dropped = sy.droppedFrames;
        window.T.fps = sy.fps;
        window.T.queue = sy.videoQueue.length;
        window.T.done = true;
        sy.stop(); ap.reset(); w.postMessage({type:'STOP'}); w.terminate();
        resolve();
      }, 1000);
    }, durSec * 1000);
  });
}

async function run() {
  var channels = ['10.1', '12.1', '3.1', '29.1'];
  var dur = 30;
  window.allResults = [];
  for (var i = 0; i < channels.length; i++) {
    await testChannel(channels[i], dur);
    var r = window.T.rendered, d = window.T.dropped;
    var rate = r+d > 0 ? ((r/(r+d))*100).toFixed(1) : '0';
    window.allResults.push({ch:channels[i], rendered:r, dropped:d, rate:rate, fps:window.T.fps, segs:window.T.segs.slice(), err:window.T.err, queue:window.T.queue});
    await new Promise(function(r){setTimeout(r,2000)});
  }
  window.benchDone = true;
  document.title = 'BENCH_DONE';
}
run();
</script>
</body>
</html>
