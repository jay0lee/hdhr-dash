<!DOCTYPE html>
<html>
<head><title>v2.0.95 Performance Test</title></head>
<body>
<script src="atsc-demuxer.js"></script>
<script src="player-renderer.js"></script>
<script>
// Headless multi-channel decode performance test
// Tests: 10.1, 12.1, 3.1, 29.1 — 30 seconds each
const CHANNELS = ['10.1', '12.1', '3.1', '29.1'];
const DURATION = 30000; // 30s per channel
const HDHR = 'http://10.1.0.4:5004/auto/v';

window.T = { ch: '', segs: [], rendered: 0, dropped: 0, fps: 0, queue: 0, err: '' };
window.allResults = [];
window.benchDone = false;

async function testChannel(ch) {
  return new Promise(async (resolve) => {
    const result = { ch, rendered: 0, dropped: 0, fps: 0, rate: 0, segs: [] };
    window.T = { ch, segs: [], rendered: 0, dropped: 0, fps: 0, queue: 0, err: '' };

    // Create canvas + renderer
    const canvas = document.createElement('canvas');
    canvas.width = 1920; canvas.height = 1080;
    document.body.appendChild(canvas);
    const renderer = new WebGLVideoRenderer(canvas);
    const audio = new WebAudioPlayer({ volume: 0 });
    const sync = new AVSynchronizer(renderer, audio, {
      onFrameStats: (s) => {
        window.T.fps = s.fps;
        window.T.rendered = s.rendered;
        window.T.dropped = s.dropped;
      }
    });
    sync.start();

    // Create worker
    const worker = new Worker('atsc-worker.js?v=2.0.95');
    worker.onmessage = (e) => {
      const msg = e.data;
      if (!msg) return;

      switch (msg.type) {
        case 'VIDEO_BATCH':
          if (msg.yuvData && msg.frames) {
            for (let i = 0; i < msg.frames.length; i++) {
              const f = msg.frames[i];
              sync.queueVideoFrame({
                pts: f.pts, width: msg.width, height: msg.height,
                isInterlaced: msg.isInterlaced,
                y: new Uint8Array(msg.yuvData, f.offset, msg.yPlaneSize),
                u: new Uint8Array(msg.yuvData, f.offset + msg.yPlaneSize, msg.uvPlaneSize),
                v: new Uint8Array(msg.yuvData, f.offset + msg.yPlaneSize + msg.uvPlaneSize, msg.uvPlaneSize),
              });
            }
          }
          window.T.queue = sync.videoQueue.length;
          break;
        case 'AUDIO_BATCH':
          if (msg.left && msg.right) {
            const left = new Float32Array(msg.left);
            const right = new Float32Array(msg.right);
            const CHUNK = 9600;
            let pts = msg.pts;
            const sr = msg.sampleRate || 48000;
            for (let s = 0; s < msg.totalSamples; s += CHUNK) {
              const len = Math.min(CHUNK, msg.totalSamples - s);
              audio.queueAudio(left.subarray(s, s + len), right.subarray(s, s + len), pts, sr);
              pts += len / sr;
            }
          }
          break;
        case 'WORKER_LOG':
          if (msg.text) {
            window.T.segs.push(msg.text);
            result.segs.push(msg.text);
          }
          break;
        case 'ERROR':
          window.T.err = msg.message;
          break;
      }
    };
    worker.postMessage({ type: 'INIT' });

    // Stream data
    const url = HDHR + ch;
    const ctrl = new AbortController();
    const timeout = setTimeout(() => {
      ctrl.abort();
      worker.postMessage({ type: 'FLUSH' });
      setTimeout(() => {
        worker.terminate();
        sync.stop();
        result.rendered = sync.renderedFrames;
        result.dropped = sync.droppedFrames;
        result.fps = sync.fps;
        const dur = DURATION / 1000;
        result.rate = dur > 0 ? Math.round(result.rendered / (dur * 30) * 100) : 0;
        canvas.remove();
        resolve(result);
      }, 1000);
    }, DURATION);

    try {
      const res = await fetch(url, { signal: ctrl.signal });
      const reader = res.body.getReader();
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        if (value && value.byteLength > 0) {
          let buf = value.byteOffset === 0 && value.byteLength === value.buffer.byteLength
            ? value.buffer : value.buffer.slice(value.byteOffset, value.byteOffset + value.byteLength);
          worker.postMessage({ type: 'CHUNK', chunk: buf }, [buf]);
        }
      }
    } catch (e) {
      if (e.name !== 'AbortError') window.T.err = e.message;
    }
  });
}

(async () => {
  for (const ch of CHANNELS) {
    const result = await testChannel(ch);
    window.allResults.push(result);
    console.log(`${ch}: rendered=${result.rendered} dropped=${result.dropped} fps=${result.fps}`);
  }
  window.benchDone = true;
  console.log('BENCHMARK COMPLETE', JSON.stringify(window.allResults.map(r => ({
    ch: r.ch, rendered: r.rendered, dropped: r.dropped, fps: r.fps, rate: r.rate,
    segs: r.segs.length
  }))));
})();
</script>
</body>
</html>
</script>
</body>
</html>
